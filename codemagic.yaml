workflows:
  smartnota-ios:
    name: Smart Nota iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Sync iOS project
        script: npx cap sync ios
      - name: Build iOS app
        script: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphoneos -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/Build/Products/Debug-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
